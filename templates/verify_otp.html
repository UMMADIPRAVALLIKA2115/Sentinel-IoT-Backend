<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Ultra | 2FA Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #05070a; --card-dark: #111827; --accent-green: #10b981; }
        body { 
            background-color: var(--bg-dark); color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        .otp-card { 
            background-color: var(--card-dark); padding: 50px; border-radius: 24px; 
            border: 1px solid #1f2937; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            width: 100%; max-width: 420px; text-align: center;
        }
        .lock-icon { font-size: 3.5rem; margin-bottom: 20px; color: var(--accent-green); }
        .otp-input { 
            background-color: #030712; color: var(--accent-green); 
            border: 2px solid #374151; font-size: 2.2rem; font-weight: 800; 
            letter-spacing: 12px; text-align: center; border-radius: 12px;
            margin-bottom: 25px; padding: 10px; width: 100%;
        }
        .btn-verify { 
            background-color: var(--accent-green); color: #05070a;
            border: none; width: 100%; padding: 14px; font-weight: 700; 
            border-radius: 12px; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="otp-card">
        <div class="lock-icon">🔐</div>
        <h2>Verify Identity</h2>
        <p style="color: #94a3b8;">Enter the 6-digit code sent to your Telegram.</p>
        
        <form action="/verify_logic" method="POST">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="000000" required autofocus>
            <button type="submit" class="btn btn-verify">Unlock System</button>
        </form>
    </div>
</body>
</html>
