<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Ultra | Secure Login</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05070a;
            --card-dark: #111827;
            --accent-blue: #38bdf8;
            --text-gray: #94a3b8;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Industrial Login Card */
        .login-card { 
            background-color: var(--card-dark); 
            padding: 45px; 
            border-radius: 24px; 
            border: 1px solid #1f2937; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* Glowing Blue Border at Top */
        .login-card::before {
            content: "";
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 40%; height: 3px;
            background: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-blue);
            border-radius: 0 0 10px 10px;
        }

        .icon-box {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--accent-blue);
        }

        h2 { font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        p.subtitle { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 30px; }

        .form-control {
            background-color: #030712;
            border: 1px solid #374151;
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .form-control:focus {
            background-color: #030712;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
            color: white;
        }

        .btn-login {
            background: var(--accent-blue);
            color: #05070a;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 700;
            border-radius: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-box">🛡️</div>
        <h2>Sentinel Ultra</h2>
        <p class="subtitle">Industrial Fleet Monitoring Access</p>

        <!-- Error Message Handling -->
        {% if error %}
        <div class="error-msg">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="text" name="username" class="form-control" placeholder="Admin Username" required autocomplete="off">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            
            <button type="submit" class="btn btn-login">Authorize Access</button>
        </form>

        <div class="mt-4 pt-2">
            <small style="color: #4b5563; text-transform: uppercase; letter-spacing: 1px; font-size: 0.65rem;">
                Node: Hyderabad Security Protocol v4.0
            </small>
        </div>
    </div>

</body>
</html>
