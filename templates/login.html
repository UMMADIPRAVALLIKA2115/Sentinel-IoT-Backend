<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Ultra | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070a;
            --card-dark: #111827;
            --accent-blue: #38bdf8;
            --text-gray: #94a3b8;
        }
        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        .login-card { 
            background-color: var(--card-dark); 
            padding: 40px; border-radius: 24px; border: 1px solid #1f2937; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%; max-width: 400px; text-align: center;
        }
        .icon-box { font-size: 3rem; margin-bottom: 10px; color: var(--accent-blue); }
        h2 { font-weight: 800; margin-bottom: 5px; }
        p.subtitle { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 25px; }
        .form-control {
            background-color: #030712; border: 1px solid #374151;
            color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px;
        }
        .btn-login {
            background: var(--accent-blue); color: #05070a; border: none;
            width: 100%; padding: 12px; font-weight: 700; border-radius: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.1); color: #f87171;
            padding: 10px; border-radius: 8px; font-size: 0.85rem;
            margin-bottom: 20px; border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-box">🛡️</div>
        <h2>Sentinel Ultra</h2>
        <p class="subtitle">Industrial Fleet Monitoring Access</p>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="text" name="username" class="form-control" placeholder="Admin Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-login">Authorize Access</button>
        </form>
    </div>
</body>
</html>
