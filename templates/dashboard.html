<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sentinel Ultra | Live IoT Dashboard
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
    </script>


    <style>

        body {

            background: #05070a;

            color: #e2e8f0;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            padding: 20px;
        }


        .glass-card {

            background:
                rgba(30, 41, 59, 0.75);

            border:
                1px solid #334155;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);
        }


        .title {

            font-weight: 900;

            letter-spacing: 1px;
        }


        .temp-main {

            font-size: 3.5rem;

            font-weight: 900;

            color: #38bdf8;
        }


        .vibration-main {

            font-size: 2rem;

            font-weight: 800;

            color: #c084fc;
        }


        .machine-select {

            background: #0f172a !important;

            color: white !important;

            border:
                1px solid #38bdf8 !important;
        }


        .status-badge {

            font-size: 1rem;

            padding:
                8px 18px;

            border-radius: 20px;

            font-weight: 800;
        }


        .status-normal {

            background: #10b981;

            color: white;
        }


        .status-warning {

            background: #f59e0b;

            color: black;
        }


        .status-emergency {

            background: #ef4444;

            color: white;

            animation:
                emergencyPulse 1s infinite;
        }


        @keyframes emergencyPulse {

            0% {
                box-shadow:
                    0 0 0
                    rgba(239,68,68,0.4);
            }

            50% {
                box-shadow:
                    0 0 25px
                    rgba(239,68,68,0.8);
            }

            100% {
                box-shadow:
                    0 0 0
                    rgba(239,68,68,0.4);
            }
        }


        .live-dot {

            display: inline-block;

            width: 10px;

            height: 10px;

            background: #22c55e;

            border-radius: 50%;

            margin-right: 7px;

            animation:
                livePulse 1s infinite;
        }


        .offline-dot {

            display: inline-block;

            width: 10px;

            height: 10px;

            background: #ef4444;

            border-radius: 50%;

            margin-right: 7px;
        }


        @keyframes livePulse {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }


        .chart-container {

            position: relative;

            height: 330px;
        }


        .small-label {

            color: #94a3b8;

            font-size: 0.85rem;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .last-update {

            color: #94a3b8;

            font-size: 0.85rem;
        }

    </style>

</head>


<body>


<div class="container-fluid">


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="title">

                🛡️ SENTINEL

                <span class="text-info">
                    ULTRA
                </span>

            </h1>


            <div
                class="mt-2"
                id="connectionStatus"
            >

                <span class="offline-dot"></span>

                Connecting...

            </div>

        </div>


        <div class="d-flex gap-2">

            <button
                onclick="downloadPDF()"
                class="btn btn-info fw-bold"
            >

                📄 GENERATE PDF

            </button>


            <a
                href="/logout"
                class="btn btn-outline-danger"
            >

                LOGOUT

            </a>

        </div>

    </div>


    <!-- ======================================================
         MAIN
    ======================================================= -->

    <div class="row">


        <!-- ==================================================
             LEFT
        =================================================== -->

        <div class="col-lg-3">


            <div class="glass-card text-center">


                <div class="small-label mb-2">

                    Machine

                </div>


                <!-- AUTOMATIC MACHINE DETECTION -->

                <select
                    id="machineSelect"
                    class="form-select machine-select mb-4"
                    onchange="refreshData()"
                >

                    <option value="">

                        Detecting machines...

                    </option>

                </select>


                <!-- TEMPERATURE -->

                <div class="small-label">

                    Live Temperature

                </div>


                <div
                    class="temp-main"
                    id="liveTemp"
                >

                    --

                </div>


                <!-- VIBRATION -->

                <div class="small-label mt-3">

                    Live Vibration

                </div>


                <div
                    class="vibration-main"
                    id="liveVibration"
                >

                    --

                </div>


                <!-- STATUS -->

                <div class="small-label mt-4">

                    Machine Status

                </div>


                <div
                    id="statusBadge"
                    class="mt-2"
                >

                    <span
                        class="status-badge status-normal"
                    >

                        WAITING

                    </span>

                </div>


                <div
                    id="lastUpdate"
                    class="last-update mt-3"
                >

                    Waiting for telemetry...

                </div>


            </div>


        </div>


        <!-- ==================================================
             RIGHT
        =================================================== -->

        <div class="col-lg-9">


            <!-- TEMPERATURE -->

            <div class="glass-card">


                <div
                    class="d-flex justify-content-between align-items-center mb-3"
                >

                    <div>

                        <h4 class="mb-1">

                            🌡️ LIVE TEMPERATURE

                        </h4>


                        <small class="text-secondary">

                            Latest 20 readings

                        </small>

                    </div>


                    <span class="badge bg-info">

                        LIVE

                    </span>

                </div>


                <div class="chart-container">

                    <canvas id="tempChart"></canvas>

                </div>


            </div>


            <!-- VIBRATION -->

            <div class="glass-card">


                <div
                    class="d-flex justify-content-between align-items-center mb-3"
                >

                    <div>

                        <h4 class="mb-1">

                            📳 LIVE VIBRATION

                        </h4>


                        <small class="text-secondary">

                            Latest 20 readings

                        </small>

                    </div>


                    <span class="badge bg-primary">

                        LIVE

                    </span>

                </div>


                <div class="chart-container">

                    <canvas id="vibChart"></canvas>

                </div>


            </div>


        </div>

    </div>

</div>


<script>


// ============================================================
// VARIABLES
// ============================================================

let tempChart = null;

let vibChart = null;

let currentMachine = "";


// ============================================================
// CREATE CHARTS
// ============================================================

function createCharts() {


    if (typeof Chart === "undefined") {

        console.error(
            "Chart.js failed to load."
        );

        return false;
    }


    // ========================================================
    // TEMPERATURE CHART
    // ========================================================

    tempChart = new Chart(

        document.getElementById(
            "tempChart"
        ),

        {

            type: "line",

            data: {

                labels: [],

                datasets: [{

                    label: "Temperature",

                    data: [],

                    borderColor:
                        "#38bdf8",

                    backgroundColor:
                        "rgba(56,189,248,0.12)",

                    borderWidth: 3,

                    fill: true,

                    tension: 0.35,

                    pointRadius: 3,

                    pointHoverRadius: 6

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                scales: {

                    x: {

                        ticks: {
                            color: "#94a3b8"
                        },

                        grid: {
                            color:
                                "rgba(148,163,184,0.10)"
                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text:
                                "Temperature °C",

                            color:
                                "#94a3b8"

                        },

                        ticks: {
                            color: "#94a3b8"
                        },

                        grid: {
                            color:
                                "rgba(148,163,184,0.10)"
                        }

                    }

                },

                plugins: {

                    legend: {
                        display: false
                    }

                }

            }

        }

    );


    // ========================================================
    // VIBRATION CHART
    // ========================================================

    vibChart = new Chart(

        document.getElementById(
            "vibChart"
        ),

        {

            type: "line",

            data: {

                labels: [],

                datasets: [{

                    label: "Vibration",

                    data: [],

                    borderColor:
                        "#c084fc",

                    backgroundColor:
                        "rgba(192,132,252,0.12)",

                    borderWidth: 3,

                    fill: true,

                    tension: 0.35,

                    pointRadius: 3,

                    pointHoverRadius: 6

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                scales: {

                    x: {

                        ticks: {
                            color: "#94a3b8"
                        },

                        grid: {
                            color:
                                "rgba(148,163,184,0.10)"
                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text:
                                "Vibration G",

                            color:
                                "#94a3b8"

                        },

                        ticks: {
                            color: "#94a3b8"
                        },

                        grid: {
                            color:
                                "rgba(148,163,184,0.10)"
                        }

                    }

                },

                plugins: {

                    legend: {
                        display: false
                    }

                }

            }

        }

    );


    return true;

}


// ============================================================
// CONNECTION
// ============================================================

function setConnection(online) {

    const element =
        document.getElementById(
            "connectionStatus"
        );


    if (online) {

        element.innerHTML =
            '<span class="live-dot"></span>' +
            ' LIVE CONNECTION';

        element.style.color =
            "#22c55e";

    } else {

        element.innerHTML =
            '<span class="offline-dot"></span>' +
            ' WAITING FOR DATA';

        element.style.color =
            "#ef4444";

    }

}


// ============================================================
// AUTOMATIC MACHINE DETECTION
// ============================================================

async function loadMachines() {

    try {

        const response =
            await fetch(
                "/get_machines",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Machine request failed: " +
                response.status
            );

        }


        const machines =
            await response.json();


        const select =
            document.getElementById(
                "machineSelect"
            );


        if (
            !machines ||
            machines.length === 0
        ) {

            select.innerHTML =
                '<option value="">' +
                'Waiting for machines...' +
                '</option>';

            setConnection(false);

            return;

        }


        const oldValue =
            select.value;


        select.innerHTML = "";


        machines.forEach(
            function(machine) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    machine;


                option.textContent =
                    machine;


                select.appendChild(
                    option
                );

            }
        );


        if (
            oldValue &&
            machines.includes(oldValue)
        ) {

            select.value =
                oldValue;

        } else {

            select.value =
                machines[0];

            currentMachine =
                machines[0];

        }


        if (
            currentMachine !==
            select.value
        ) {

            currentMachine =
                select.value;

        }


        await refreshData();


        setConnection(true);


    } catch (error) {

        console.error(
            "Machine detection error:",
            error
        );

        setConnection(false);

    }

}


// ============================================================
// LIVE DATA
// ============================================================

async function refreshData() {

    const select =
        document.getElementById(
            "machineSelect"
        );


    const machine =
        select.value;


    if (!machine) {

        return;

    }


    currentMachine =
        machine;


    try {

        const response =
            await fetch(

                `/get_data/${encodeURIComponent(machine)}`,

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Telemetry request failed: " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            data.length === 0
        ) {

            return;

        }


        // ====================================================
        // LATEST 20
        // ====================================================

        const latest20 =
            data.slice(-20);


        const times =
            latest20.map(
                item => item.time
            );


        const temperatures =
            latest20.map(
                item => item.temp
            );


        const vibrations =
            latest20.map(
                item => item.vib
            );


        // ====================================================
        // TEMPERATURE GRAPH
        // ====================================================

        if (tempChart) {

            tempChart.data.labels =
                times;

            tempChart.data.datasets[0].data =
                temperatures;

            tempChart.update(
                "none"
            );

        }


        // ====================================================
        // VIBRATION GRAPH
        // ====================================================

        if (vibChart) {

            vibChart.data.labels =
                times;

            vibChart.data.datasets[0].data =
                vibrations;

            vibChart.update(
                "none"
            );

        }


        // ====================================================
        // LATEST VALUE
        // ====================================================

        const latest =
            latest20[
                latest20.length - 1
            ];


        document.getElementById(
            "liveTemp"
        ).innerText =
            Number(
                latest.temp
            ).toFixed(1) + "°C";


        document.getElementById(
            "liveVibration"
        ).innerText =
            Number(
                latest.vib
            ).toFixed(2) + " G";


        // ====================================================
        // STATUS
        // ====================================================

        const badge =
            document.getElementById(
                "statusBadge"
            );


        let statusClass =
            "status-normal";


        if (
            latest.status ===
            "WARNING"
        ) {

            statusClass =
                "status-warning";

        }


        if (
            latest.status ===
            "EMERGENCY"
        ) {

            statusClass =
                "status-emergency";

        }


        badge.innerHTML =
            `<span class="status-badge ${statusClass}">
                ${latest.status}
            </span>`;


        // ====================================================
        // TIME
        // ====================================================

        document.getElementById(
            "lastUpdate"
        ).innerText =
            "Last reading: " +
            latest.time;


        setConnection(true);


    } catch (error) {

        console.error(
            "Telemetry error:",
            error
        );

        setConnection(false);

    }

}


// ============================================================
// PDF
// ============================================================

function downloadPDF() {

    const machine =
        document.getElementById(
            "machineSelect"
        ).value;


    if (!machine) {

        alert(
            "Please wait for a machine."
        );

        return;

    }


    window.location.href =
        `/export_report/${encodeURIComponent(machine)}`;

}


// ============================================================
// START
// ============================================================

async function startDashboard() {

    if (!createCharts()) {

        return;

    }


    await loadMachines();


    await refreshData();


    // Live graph every 1 second

    setInterval(
        refreshData,
        1000
    );


    // Detect machines every 3 seconds

    setInterval(
        loadMachines,
        3000
    );

}


document.addEventListener(
    "DOMContentLoaded",
    startDashboard
);


</script>


</body>

</html>
