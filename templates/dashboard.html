<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel Ultra | Cloud Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #05070a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .temp-main { font-size: 3.5rem; font-weight: 900; color: #38bdf8; }
        .bg-NORMAL { background: #10b981; } .bg-WARNING { background: #f59e0b; color: #000; } .bg-EMERGENCY { background: #ef4444; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">🛡️ SENTINEL <span class="text-info">ULTRA</span></h1>
            <div class="d-flex gap-2">
                <button onclick="downloadPDF()" class="btn btn-info">GENERATE PDF</button>
                <a href="/logout" class="btn btn-outline-danger">LOGOUT</a>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-3">
                <div class="glass-card text-center">
                    <h6>MACHINE</h6>
                    <select id="machineSelect" class="form-select bg-dark text-white border-info mb-4" onchange="refreshData()"></select>
                    <h6>LIVE TELEMETRY</h6>
                    <div class="temp-main" id="liveTemp">--</div>
                    <div id="statusBadge" class="mt-2"></div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="glass-card"><canvas id="tempChart" height="85"></canvas></div>
                <div class="glass-card"><canvas id="vibChart" height="85"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        const chartConfig = (color) => ({
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: color, fill: true, backgroundColor: color+'22', tension: 0.4 }] },
            options: { scales: { y: { beginAtZero: false } }, plugins: { legend: { display: false } } }
        });

        const tempChart = new Chart(document.getElementById('tempChart'), chartConfig('#38bdf8'));
        const vibChart = new Chart(document.getElementById('vibChart'), chartConfig('#a855f7'));

        async function refreshData() {
            const m_id = document.getElementById('machineSelect').value;
            if(!m_id) return;
            const res = await fetch(`/get_data/${m_id}`);
            const data = await res.json();
            if(data.length > 0) {
                const times = data.map(i => i.time);
                tempChart.data.labels = times; tempChart.data.datasets[0].data = data.map(i => i.temp); tempChart.update('none');
                vibChart.data.labels = times; vibChart.data.datasets[0].data = data.map(i => i.vib); vibChart.update('none');
                
                const latest = data[data.length - 1];
                document.getElementById('liveTemp').innerText = latest.temp + "°C";
                document.getElementById('statusBadge').innerHTML = `<span class="badge bg-${latest.status}">${latest.status}</span>`;
            }
        }

        async function loadMachines() {
            const res = await fetch('/get_machines');
            const machines = await res.json();
            const select = document.getElementById('machineSelect');
            if(machines.length > 0 && !select.value) {
                select.innerHTML = machines.map(m => `<option value="${m}">${m}</option>`).join("");
            }
        }

        function downloadPDF() { window.location.href = `/export_report/${document.getElementById('machineSelect').value}`; }

        setInterval(() => { loadMachines(); refreshData(); }, 2000);
    </script>
</body>
</html>
