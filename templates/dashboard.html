<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel-IoT Ultimate | Analytics Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #05070a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 25px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .btn-glow { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .temp-main { font-size: 3rem; font-weight: 900; color: #38bdf8; }
        .bg-NORMAL { background: #10b981; } 
        .bg-WARNING { background: #f59e0b; color: black; } 
        .bg-EMERGENCY { background: #ef4444; }
        select option { background: #1e293b; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">🛡️ SENTINEL <span class="text-info">ULTIMATE</span></h1>
            <div class="d-flex gap-2">
                <a href="/apidocs" target="_blank" class="btn btn-outline-info">API DOCS</a>
                <button onclick="downloadPDF()" class="btn btn-glow">GENERATE PDF</button>
                <a href="/login" class="btn btn-outline-danger">LOGOUT</a>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-3">
                <div class="glass-card text-center">
                    <h6>MACHINE SELECTION</h6>
                    <!-- Dropdown for selecting machines -->
                    <select id="machineSelect" class="form-select bg-dark text-white border-info mb-4" onchange="refreshAll()">
                        <option value="">Waiting for data...</option>
                    </select>
                    
                    <h6>LIVE TEMP</h6>
                    <div class="temp-main" id="liveTemp">--</div>
                    
                    <h6>LIVE VIBRATION</h6>
                    <div class="h3 text-info" id="liveVib">-- G</div>
                    
                    <div id="statusBadge" class="mt-2"></div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="glass-card">
                    <h6 class="text-secondary">TEMPERATURE TREND (C)</h6>
                    <canvas id="tempChart" height="80"></canvas>
                </div>
                <div class="glass-card">
                    <h6 class="text-secondary">VIBRATION ANALYSIS (G)</h6>
                    <canvas id="vibChart" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chart Configuration Helper
        const chartConfig = (label, color) => ({
            type: 'line',
            data: { labels: [], datasets: [{ label: label, data: [], borderColor: color, fill: true, backgroundColor: color+'22', tension: 0.4 }] },
            options: { 
                animation: false,
                scales: { y: { beginAtZero: false, grid: { color: '#334155' } }, x: { grid: { display: false } } }, 
                plugins: { legend: { display: false } } 
            }
        });

        const tempChart = new Chart(document.getElementById('tempChart'), chartConfig('Temp', '#38bdf8'));
        const vibChart = new Chart(document.getElementById('vibChart'), chartConfig('Vibration', '#a855f7'));

        async function refreshAll() {
            const m_id = document.getElementById('machineSelect').value;
            if(!m_id) return;

            try {
                const res = await fetch(`/get_data/${m_id}`);
                const data = await res.json();
                
                if(data.length > 0) {
                    const times = data.map(i => i.time);
                    
                    // Update Temperature Chart
                    tempChart.data.labels = times; 
                    tempChart.data.datasets[0].data = data.map(i => i.temp); 
                    tempChart.update();

                    // Update Vibration Chart
                    vibChart.data.labels = times; 
                    vibChart.data.datasets[0].data = data.map(i => i.vib); 
                    vibChart.update();
                    
                    // Update Live Stats
                    const latest = data[data.length - 1];
                    document.getElementById('liveTemp').innerText = latest.temp + "°C";
                    document.getElementById('liveVib').innerText = latest.vib + " G";
                    document.getElementById('statusBadge').innerHTML = `<span class="badge bg-${latest.status} p-2">${latest.status}</span>`;
                }
            } catch (err) {
                console.error("Error fetching telemetry:", err);
            }
        }

        async function loadMachines() {
            try {
                const res = await fetch('/get_machines');
                const machines = await res.json();
                const select = document.getElementById('machineSelect');
                
                // Only update dropdown if machines exist and we haven't populated it yet
                if(machines.length > 0 && (select.options.length <= 1)) {
                    select.innerHTML = machines.map(m => `<option value="${m}">${m}</option>`).join("");
                    refreshAll(); // Load data for the first machine immediately
                }
            } catch (err) {
                console.error("Error loading machines:", err);
            }
        }

        function downloadPDF() { 
            const m_id = document.getElementById('machineSelect').value;
            if(m_id) {
                window.location.href = `/export_report/${m_id}`; 
            } else {
                alert("Please select a machine first");
            }
        }

        // Initialize
        loadMachines();
        
        // Auto-refresh every 3 seconds
        setInterval(() => { 
            loadMachines(); 
            refreshAll(); 
        }, 3000);
    </script>
</body>
</html>
