<!DOCTYPE html>
<html>
<head>
    <title>Sentinel-IoT Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; font-family: sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">🏭 Sentinel-IoT: Machine Health Monitor</h2>
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card p-4">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
        </div>
        <p class="text-center mt-4 text-muted">Status: Live Data from Hyderabad Plant</p>
    </div>

    <script>
        const ctx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Machine Temperature (°C)',
                    data: [],
                    borderColor: '#ff4757',
                    backgroundColor: 'rgba(255, 71, 87, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { scales: { y: { min: 40, max: 110 } } }
        });

        // Function to fetch data from Python every 2 seconds
        async function updateChart() {
            const response = await fetch('/get_data');
            const data = await response.json();
            
            tempChart.data.labels = data.map(item => item.time);
            tempChart.data.datasets[0].data = data.map(item => item.temp);
            tempChart.update('none'); // Update smoothly
        }

        setInterval(updateChart, 2000);
    </script>
</body>
</html>
